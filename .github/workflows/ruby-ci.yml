name: ruby-sdk

on:
  push:
    branches: [master]
    paths: ['ruby/**', '.github/workflows/ruby-ci.yml']
  pull_request:
    paths: ['ruby/**', '.github/workflows/ruby-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: ruby

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3', '3.4', '4.0']

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          working-directory: ruby

      - name: Lint
        run: bundle exec rake lint

      - name: Unit tests
        run: bundle exec rake test

      - name: Run the documented examples against a mock server
        run: bundle exec rake examples:smoke

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ruby

      - name: Build the gem
        run: gem build pactman-nonprofit-check-plus.gemspec --strict
