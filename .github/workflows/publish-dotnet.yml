name: publish-dotnet

# Publishes dotnet/ to NuGet when a tag like `dotnet-v1.0.0` is pushed.
# The tag prefix keeps this from firing for SDKs in other languages.

on:
  push:
    tags: ['dotnet-v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: dotnet

jobs:
  publish:
    runs-on: ubuntu-latest
    # Create an environment of this name in repo settings to require a manual
    # approval before anything reaches NuGet. The nuget.org Trusted Publishing
    # policy names it too, so renaming it here means updating the policy.
    environment: nuget-publish
    permissions:
      contents: read
      # Lets the job request the GitHub OIDC token that NuGet/login exchanges
      # for a short-lived nuget.org API key (Trusted Publishing).
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink stamps the commit into the symbols, which needs real history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fail if the tag and Directory.Build.props disagree
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#dotnet-v}"
          PKG_VERSION="$(sed -n 's:.*<PactmanSdkVersion>\(.*\)</PactmanSdkVersion>.*:\1:p' Directory.Build.props)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag says $TAG_VERSION but Directory.Build.props says $PKG_VERSION."
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test --configuration Release --no-build

      - name: Run the documented examples against a mock server
        run: dotnet run --project scripts/Pactman.NonprofitCheckPlus.Tools --configuration Release --no-build -- examples-smoke

      - name: Pack
        run: dotnet pack src/Pactman.NonprofitCheckPlus/Pactman.NonprofitCheckPlus.csproj --configuration Release --no-build -o artifacts

      # Trusted Publishing: no stored API key. NuGet/login trades this job's
      # OIDC token for a key that lives one hour, so it runs right before the
      # push. NUGET_USER is the nuget.org username (not email) of whoever
      # created the Trusted Publishing policy.
      - name: NuGet login (OIDC to temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate makes a re-run of a published version a no-op rather
      # than a hard failure.
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
