name: publish-java

# Publishes java/ to Maven Central when a tag like `java-v1.0.0` is pushed.
# The tag prefix keeps this from firing for SDKs in other languages.

on:
  push:
    tags: ['java-v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: java

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional: create an environment of this name in repo settings to require
    # a manual approval before anything reaches Maven Central. Delete if not wanted.
    environment: maven-central-publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # Writes ~/.m2/settings.xml with a `central` server entry and imports
          # the signing key the release profile's gpg plugin uses.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Fail if the tag and the POM disagree
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#java-v}"
          POM_VERSION="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout -pl sdk)"
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "Tag says $TAG_VERSION but the POM says $POM_VERSION."
            exit 1
          fi

      # `verify` runs the unit tests and every documented example against the
      # bundled fixture API.
      - name: Build, test and run the examples
        run: mvn -B --no-transfer-progress verify

      # SdkVersion.VERSION is a compile-time constant held against the POM by a
      # unit test; `verify` above is what proves the number being published and
      # the number in the User-Agent are the same one.
      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "No Maven Central credentials set; nothing was published."
            exit 1
          fi
          mvn -B --no-transfer-progress -Prelease -DskipTests -pl sdk deploy
