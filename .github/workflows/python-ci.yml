name: python-sdk

on:
  push:
    branches: [master]
    paths: ['python/**', '.github/workflows/python-ci.yml']
  pull_request:
    paths: ['python/**', '.github/workflows/python-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: python

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy

      - name: Unit tests
        run: pytest

      - name: Run the documented examples against a mock server
        run: python scripts/run_examples_against_mock.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the distributions
        run: python -m pip install --upgrade pip build && python -m build

      - name: Check the metadata renders on PyPI
        run: pip install twine && twine check dist/*
