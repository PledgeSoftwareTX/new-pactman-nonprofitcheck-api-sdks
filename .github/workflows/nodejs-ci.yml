name: nodejs-sdk

on:
  push:
    branches: [master]
    paths: ['nodejs/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['nodejs/**', '.github/workflows/ci.yml']

defaults:
  run:
    working-directory: nodejs

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: nodejs/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run the documented examples against a mock server
        run: npm run examples:smoke
