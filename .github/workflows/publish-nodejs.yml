name: publish-nodejs

# Publishes nodejs/ to npm when a tag like `nodejs-v1.0.0` is pushed.
# The tag prefix keeps this from firing for SDKs in other languages.

on:
  push:
    tags: ['nodejs-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing and provenance

defaults:
  run:
    working-directory: nodejs

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional: create an environment of this name in repo settings to require
    # a manual approval before anything reaches npm. Delete if not wanted.
    environment: npm-publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: nodejs/package-lock.json

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Use a recent npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Fail if the tag and package.json disagree
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#nodejs-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag says $TAG_VERSION but package.json says $PKG_VERSION."
            exit 1
          fi
        if: github.event_name == 'push'

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run examples:smoke

      # Authenticates with the NPM_TOKEN repo secret. The token must be a
      # granular access token with read+write on this package and "bypass 2FA"
      # enabled, or npm rejects the publish under an auth-and-writes 2FA policy.
      #
      # To switch to trusted publishing later, register this repo and workflow
      # as a trusted publisher on npmjs.com, then delete the env block below —
      # OIDC needs no secret and is not subject to the 2FA requirement.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
