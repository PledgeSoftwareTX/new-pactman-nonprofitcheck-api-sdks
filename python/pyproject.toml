[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pactman-nonprofit-check-plus"
version = "1.0.0"
description = "Official Python SDK for the Pactman Nonprofit Check Plus API — verify US nonprofits by EIN against IRS BMF, Publication 78, Automatic Revocation and OFAC data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pactman" }]
keywords = [
  "pactman",
  "nonprofit",
  "charity",
  "ein",
  "irs",
  "pub78",
  "bmf",
  "ofac",
  "compliance",
  "sdk",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/PledgeSoftwareTX/new-pactman-nonprofitcheck-api-sdks/tree/master/python#readme"
Documentation = "https://pactman.org/nonprofitcheckplus-api/docs"
Source = "https://github.com/PledgeSoftwareTX/new-pactman-nonprofitcheck-api-sdks/tree/master/python"
Issues = "https://github.com/PledgeSoftwareTX/new-pactman-nonprofitcheck-api-sdks/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
  # Runtime only needs this below 3.11, but mypy is pinned to python_version
  # 3.10 and always analyses the tomli fallback, so install it everywhere.
  "tomli>=1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pactman_nonprofit_check_plus"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "examples", "scripts"]
strict = true
warn_unreachable = true
mypy_path = "scripts"

[[tool.mypy.overrides]]
# Stdlib on 3.11+; ships without a py.typed marker on some interpreters.
module = "tomllib"
ignore_missing_imports = true

[tool.ruff]
line-length = 96
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
  # Wire field names are mirrored verbatim; renaming them would break parity
  # with the API reference.
  "N815",
]

[tool.ruff.lint.per-file-ignores]
# __all__ is grouped by concern to match the module layout, not alphabetized.
"src/pactman_nonprofit_check_plus/__init__.py" = ["RUF022"]
"tests/*" = ["E501"]
